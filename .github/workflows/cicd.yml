name: BUILD-PUSH-DEPLOY

on:
  push:
    branches: ["main"]

jobs:
  BUILD-PUSH-DEPLOY:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build with Maven
        run: mvn -B package

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/java-docker-app:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/java-docker-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop java-docker-app || true
            docker rm java-docker-app || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/java-docker-app:latest
            docker run -d -p 8010:8010 --name java-docker-app ${{ secrets.DOCKERHUB_USERNAME }}/java-docker-app:latest
            docker ps -a
